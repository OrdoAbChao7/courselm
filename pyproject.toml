[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "courselm"
version = "0.1.0"
description = "课程资料 → NotebookLM → Markdown / PDF 复习讲义"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # NotebookLM 交互层（逆向 RPC 客户端，[browser] extra 引入 playwright 用于首次登录）
    "notebooklm-py[browser]>=0.8.1,<0.9",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "pydantic>=2.6",
    "markdown-it-py>=3.0,<5",
    "mdit-py-plugins>=0.4,<0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
figures = ["Pillow>=10", "numpy>=1.26", "pypdfium2>=4.30,<6", "python-pptx>=1.0", "python-docx>=1.1"]

[project.scripts]
courselm = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["modules", "studio"]

[tool.setuptools.package-data]
studio = ["static/*", "static/vendor/*", "static/vendor/katex/*", "static/vendor/katex/fonts/*"]
