# CourseLM 默认提示词：考前三天冲刺讲义
# 固定模块按教学路径执行；题型识别完成后动态生成各题型精讲。

fixed:
  - id: study_guide
    title: 使用说明
    output_file: 00-使用说明.md
    template: |
      请基于本笔记本中的全部课程资料，为基础薄弱、距离期末考试三天的学生编写本讲义的使用说明。

      必须包含：
      1. 这份讲义适合谁，以及“抓核心、会识别、能复现、少失分”的使用目标。
      2. 剩余三天、只剩一天、只剩两小时三种阅读路线，引用本讲义的实际章节名称。
      3. 重要度、难度和“时间不足可放弃”的标记说明。
      4. 蓝色核心知识、橙色高频重点、红色易错警告、绿色解题与自测、灰色补充内容的含义。
      5. 明确提醒：先完成自测再看答案；遇到不懂术语先回看“零基础补给站”。

      只写可执行说明，不写课程历史或空泛鼓励。使用短段落、清单和表格。

  - id: three_day_plan
    title: 考前三天学习规划
    output_file: 01-考前三天学习规划.md
    template: |
      请为基础薄弱、距离期末考试三天的学生制定一份具体学习规划。默认每天投入 4 至 6 小时，总计 12 至 18 小时。

      必须严格分为第一天、第二天、第三天。每天都包含：
      - 当日目标；
      - 必须阅读的讲义章节；
      - 按 30 至 90 分钟拆分的时间预算；
      - 具体学习任务；
      - 当日完成标准；
      - 10 至 20 分钟的结束自测；
      - 未达标时应回看的章节。

      第一天聚焦考试地图、零基础补给站、一页知识骨架和核心考点卡；第二天聚焦公式工具箱、题型识别地图和高频题型精讲；第三天聚焦易错点诊断室、最小训练集、考前速记和综合自测与补救路线。

      使用任务清单和时间表。计划必须具体到“完成哪一部分、做什么动作、达到什么标准”，不要写“认真复习”等空泛任务。

  - id: exam_map
    title: 考试地图
    output_file: 02-考试地图.md
    template: |
      请分析全部课程资料，尤其是作业、例题和历年试卷，为基础薄弱学生制作考试地图。

      必须包含：
      1. 考试模块、常见题型、重要度、难度、建议投入和拿分策略总表。
      2. “必拿分”“重点突破”“时间不足可放弃”三类内容。
      3. 知识点到题型的对应关系。
      4. 一条从最容易拿分到较难综合题的复习顺序。

      只有资料明确给出分值或频率时才能写具体数字；证据不足时使用高/中/低等相对等级，并说明这是基于资料分布的判断。

  - id: prerequisite_rescue
    title: 零基础补给站
    output_file: 03-零基础补给站.md
    template: |
      请找出完成本课程高频题型所必需、但基础薄弱学生最可能缺失的先修知识。只补最低限度，不写成完整教材。

      每个基础点固定包含：
      - 一句话解释；
      - 一个直观例子或类比；
      - 正式表达；
      - 后续哪些考点或题型会用到；
      - 一道 30 秒自测及紧随其后的折叠式答案提示。

      覆盖必要数学工具、常用符号、单位、基本操作和容易混淆的术语。术语首次出现必须解释。

  - id: knowledge_structure
    title: 一页知识骨架
    output_file: 04-一页知识骨架.md
    template: |
      请把整门课程压缩成基础薄弱学生能够迅速理解的知识骨架。

      首先用“基本对象 → 核心规律 → 重要公式 → 可解决的问题 → 常见考试题型”给出一页式总览。随后简要说明：
      1. 这门课研究什么、核心问题是什么；
      2. 哪些知识是地基，哪些模块依赖这些地基；
      3. 模块之间为什么按照当前顺序连接；
      4. 推荐学习顺序；
      5. 哪些内容必须掌握、哪些只需认识。

      目标是建立位置感，不展开长篇证明或低频细节。

  - id: core_exam_points
    title: 核心考点卡
    output_file: 05-核心考点卡.md
    template: |
      请筛选本课程最值得在考前三天掌握的核心考点，并为每个考点制作独立考点卡。

      每张考点卡必须包含：
      - 一句话理解；
      - 它解决什么问题；
      - 直观解释或类比；
      - 正式定义；
      - 核心公式及符号说明；
      - 适用条件；
      - 考试会怎么问；
      - 一个最小例子；
      - 一道 30 秒自测及答案。

      先人话后术语，先直觉后公式。删除低频扩展和长篇证明；无法删掉的推导只保留关键两三步。

  - id: formula_summary
    title: 公式工具箱
    output_file: 06-公式工具箱.md
    template: |
      请把课程公式整理成“会选公式”的工具箱，而不是单纯公式清单。

      每个公式必须包含：名称、公式本体、一句话解释、每个符号的含义与单位、适用条件、题目触发关键词、常见变形、与相似公式的区别、最容易代错的位置和一个最小计算例子。

      末尾必须提供三张清单：
      1. 必须背下来的公式；
      2. 可以现场推导的公式；
      3. 外形相似、最容易混淆的公式。

      按考试用途分组，公式必须使用标准 LaTeX。

  - id: question_type_summary
    title: 题型识别地图
    output_file: 07-题型识别地图.md
    template: |
      请分析全部课程资料中的作业、例题、课后题和历年试卷，为基础薄弱学生建立题型识别地图。题型数量不超过 {max_types} 类。

      对每类题型必须说明：
      - 题型名称（10 个字以内）；
      - 题目会出现哪些识别信号或关键词；
      - 这类题本质上考什么；
      - 看到题后的第一反应；
      - 核心公式或方法；
      - 难度与相对重要度；
      - 最容易误判成什么题型。

      先给“题目特征 → 题型 → 第一反应 → 核心工具”的总表，再给文字说明。资料不足时不得伪造频率和分值。

      文档末尾必须输出机器可解析的题型清单，表头和格式严格如下：

      | 序号 | 题型名称 |
      | --- | --- |
      | 1 | xxx |
      | 2 | xxx |

  - id: mistake_diagnostics
    title: 易错点诊断室
    output_file: 09-易错点诊断室.md
    template: |
      请基于资料中的典型错误、易混概念、题目陷阱和解题过程，为基础薄弱学生建立易错点诊断室。

      按以下根源分类：概念没理解、题型判断错误、公式选择或适用条件错误、符号与单位错误、计算步骤错误、答案形式不完整、时间管理错误。

      使用对照表列出：错误做法、错误原因、正确做法、检查方法、回看章节。补充“阅卷时为什么会扣分”和考场快速检查清单。

  - id: minimal_training
    title: 最小训练集
    output_file: 10-最小训练集.md
    template: |
      请用尽量少的题目覆盖本课程最重要的考试能力，面向基础薄弱学生设计最小训练集。

      训练分四轮：
      1. 照着模板做；
      2. 只给步骤提示；
      3. 完全独立完成；
      4. 加入一个常见变式。

      每道题标注对应考点、对应题型、难度、建议用时、最可能卡住的位置、做错后应回看的讲义章节。题目区与答案区必须分离；答案给出关键步骤和评分点，不只给最终结果。

  - id: final_cram_sheet
    title: 考前速记
    output_file: 11-考前速记.md
    template: |
      请生成可脱离正文单独打印的考前速记，内容只保留最高收益信息。

      固定包含六个紧凑模块：一页知识地图、一页必背公式、一页题型识别表、一页标准解题流程、一页高频易错点、一页考试时间分配建议。

      使用短句、表格和清单。禁止长篇解释、完整推导和低频扩展。任何公式都要保留适用条件提示。

  - id: comprehensive_self_test
    title: 综合自测与补救路线
    output_file: 12-综合自测与补救路线.md
    template: |
      请为基础薄弱学生设计一套短小综合诊断，不追求完整模拟卷，而要快速暴露薄弱环节。

      必须覆盖：核心概念、公式选择、题型识别、标准步骤、易错条件和综合应用。每题标注建议用时和对应章节，题目区与答案区分离。

      最后根据错误表现给出明确补救路线：概念题错得多、公式不会选、知道公式但不会做、步骤断裂、计算失误、答案不完整分别应回看哪一章、完成什么动作、用什么标准重新自测。

dynamic:
  question_type_detail:
    title: 高频题型精讲
    output_subdir: 08-高频题型精讲
    template: |
      本课程题型清单为：{type_list}。

      请针对「{type_name}」制作一份面向基础薄弱学生的高频题型精讲。

      必须包含：
      1. 题型识别信号：题目长什么样、出现哪些关键词或已知条件；
      2. 本质考点：这类题真正考什么；
      3. 标准解题流程：用“第一步、第二步……”动作指令写出，每一步解释为什么这样做；
      4. 基础例题：优先使用资料中的代表性题目，给出完整步骤、依据和评分点；
      5. 遮住答案后的独立练习：给一道同层次题目，把答案放到文档后部；
      6. 常见变式与解法选择；
      7. 易错步骤、错误原因和检查方法；
      8. 与其他题型的联系；
      9. 做完后能够自检的完成标准。

      不得只展示漂亮答案，必须教会学生如何识别题型、如何想到下一步、如何检查结果。
