generation_schema_version: 3

planning:
  course_outline:
    id: course_outline
    title: 课程结构分析
    output_file: outline.json
    template: |
      请通读全部已上传课程资料，确定这门课真实、可用于期末复习的章节结构。
      优先尊重老师课件、教材目录和教学顺序；可以合并重复章节，但不要凭空发明资料中不存在的知识体系。
      只输出一个 JSON 对象，不要输出 Markdown 代码围栏或解释文字，结构严格为：
      {{"course_name":"课程名","chapters":[{{"index":1,"title":"章节名","topics":["主题1","主题2"]}}]}}
      index 从 1 连续编号，chapters 至少包含一个章节，topics 必须是当前章节的主要主题。

global:
  introduction:
    id: introduction
    title: 绪论
    output_file: 00-绪论.md
    template: |
      请根据课程资料生成《{course_name}》期末突击自学讲义的简短使用说明。
      读者有高中基础，但刚开始学这门课，主要靠讲义自主准备期末考试。
      说明如何按“本章路线→标准例题→自己试→章末过关”学习，课程章节之间的先后关系，以及资料有依据时哪些内容先学、哪些有余力再学。
      不要写固定三天日程、虚构分数或考试频率，不要重复章节正文。让学生尽快进入第一章，避免宽表格和术语堆积。章节列表如下：
      {outline}

  appendices:
    - id: formula_appendix
      title: 附录一 重要公式汇总
      output_file: appendix/01-重要公式汇总.md
      template: |
        请根据课程资料和下方课程章节规划，整理学过之后使用的公式速查。
        按章节排列，每条写公式名称、公式、符号含义、适用条件、它服务的题型。不要用四列及以上的宽表，不要凭空补公式；入门解释留在章节例题旁。
        课程章节规划：
        {outline}
    - id: question_index
      title: 附录二 典型题型索引
      output_file: appendix/02-典型题型索引.md
      template: |
        请根据课程资料和下方课程章节规划，生成按章排列的题型查找索引。
        每项只写题型名称、识别线索、所在章节；不得推测例题编号或页码。只收录资料支持的题型，无法确认的内容标[待确认]。完整解法留在章节中。
        课程章节规划：
        {outline}
    - id: final_review
      title: 附录三 考前复习提要
      output_file: appendix/03-考前复习提要.md
      template: |
        请根据课程资料和下方课程章节规划，生成学完讲义后使用的考前复习提要。
        按章节用短段落或简短列表回忆关键条件、基本结论、必会题型与易错点。只有资料明确支持时才标注考试重点，不写虚构频率、分值或得分承诺；不使用高密度宽表格。
        课程章节规划：
        {outline}

dynamic:
  chapter:
    title: 章节复习内容
    output_subdir: chapters
    template: |
      你正在生成第{chapter_index}章《{chapter_title}》的期末突击自学讲义。读者有高中基础，但刚开始学这门大学课程。
      本章主要主题：{topics}
      全课程章节规划：
      {outline}

      严格按下面顺序输出。每个题型必须从一道具体的简单题开始讲；不编造考试频率、题目出处、评分比例和得分承诺。
      # 第{chapter_index}章 {chapter_title}
      ## 本章路线
      控制在一页以内：这章解决什么问题、需要哪些前置知识、按什么顺序学题型、学完能独立做什么。按资料证据标“先学”或“有余力再学”，不声称无依据的“高频”。
      ## 题型一：具体题型名称
      每章按真实的基础题型继续写题型二、题型三等。每一类都重复下面的小节，不要先集中罗列所有知识、通用步骤或例题。
      ### 先知道什么
      只补本题马上要用的概念：先用一句白话说明用途，再给必要的正式表述、符号含义和适用条件；忘记上一章知识时就地补最小的一步并指明回看位置。不要把高中课程重讲一遍。
      ### 标准例题：题型名称
      先给最典型、计算负担最小、能完整展示基本动作的一道题，再标明真实来源。资料中的题都太难时可自编，并标[必要补充]，不能伪装成真题。题干完整、条件清楚。
      ### 跟着做
      用编号步骤完整解答。每个关键步骤都紧跟“这一步做什么、为什么这样做、怎么算出来”；尤其不能省略从题目到公式、从公式到结论的跳转。简单四则运算可合并。证明题说明为何想到定理、每个条件在哪里用；概念题用具体例子或反例解释边界。核对计算和最终结论。
      ### 从题归纳
      在看完解答后，用少量编号步骤归纳识别线索、可复用的做法及适用条件。不要重抄整篇解答，不要给脱离例题的空白答题模板。
      ### 自己试
      给一道与标准例题很接近的独立练习，先给不泄露答案的起步提示，再在明显分隔的“解答”中写关键步骤和答案；指出一处最可能犯的错及改法。不要只给最终答案。
      只有常见变化会改变解法时，才在本题型末尾补一题短变式，解释变在哪里、做法为何变；不要固定凑题数。
      ## 章末过关
      给少量混合题检验学生能否认出题型、独立完成基础步骤并判断公式条件。提供提示、关键步骤、答案和做错后应回看的具体题型。章末易错提醒只保留在多类题中都会遇到的高价值错误，避免与题型内重复。
