# ============================================================
# CourseLM Prompt 模板
#
# 分两类：
#   fixed   —— 阶段一固定 Prompt，依次执行；output_file 相对 output/<课程>/md/
#   dynamic —— 阶段二动态 Prompt，按解析出的题型逐个执行
#
# 占位符（运行时填充，勿改动花括号本身）：
#   {max_types}  —— 题型数量上限（来自 config.yaml: prompt_runner.max_question_types）
#   {type_name}  —— 当前题型名称
#   {type_list}  —— 全部题型名称清单（顿号连接），供"与其他题型的联系"引用
#
# 所有 Prompt 由 modules.prompts 统一追加 Markdown 与公式输出规范，
# 避免在每个模板中重复维护相同的 LaTeX/Obsidian 约束。
# ============================================================

fixed:
  - id: knowledge_structure
    title: 知识结构
    output_file: 知识结构.md
    template: |
      请基于本笔记本中的全部资料（教材、课件、作业、试卷等），用中文为这门课程生成一份完整的知识结构文档。

      要求：

      1. 课程概述：这门课研究什么、要解决的核心问题是什么（3-5 句话）。
      2. 章节结构：按教材/课件的章节体系梳理完整结构，使用 Markdown 多级标题与列表呈现。
      3. 每章要点：对每一章用 2-4 句话概括核心内容，并列出该章的关键概念；重要概念用 [[概念名]] 的 Obsidian 内链格式书写。
      4. 知识依赖：分析章节之间的先修关系——哪些章是全课程的地基、哪些章依赖哪些前文内容，给出简明的依赖说明。
      5. 学习路线：最后给出一条推荐学习顺序，指出哪里是难点需要多花时间、哪里可以快速通过。

      格式要求：
      - Markdown 输出，全文有且仅有一个一级标题。
      - 公式用 LaTeX：行内 $...$，独立公式 $$...$$。
      - 不要输出寒暄、开场白或结尾套话，无需附资料引用编号。

  - id: question_type_summary
    title: 题型总结
    output_file: 题型/题型总结.md
    template: |
      请仔细阅读本笔记本中的全部资料，重点分析作业、历年试卷、例题与课后习题，用中文总结这门课程的常考题型。

      要求：

      1. 遍历资料中出现的所有题目，将它们归纳为若干题型；题型数量不超过 {max_types} 类。若题目众多，优先保留出现频率高、分值大、最具代表性的题型。
      2. 对每一类题型，依次给出：
         - 题型名称：简短、明确的中文名称，10 个字以内，能够唯一标识这类题；
         - 典型特征：这类题长什么样、常见设问方式；
         - 高频解法：解决这类题的标准思路与解题步骤（每类 1-3 个最常用、最可靠的解法）；
         - 考查频率：根据资料中出现的次数标注"高频/中频/低频"。
      3. 全文 Markdown 格式，公式用 LaTeX（$...$ 与 $$...$$），关键概念可用 [[内链]]。
      4. 不要输出寒暄或结尾套话，无需附资料引用编号。

      最后必须输出：

      在文档最末尾，输出一个"题型清单"表格作为机器可解析的索引，格式严格如下（表头固定，不要改动）：

      | 序号 | 题型名称 |
      | --- | --- |
      | 1 | xxx |
      | 2 | xxx |

      表格中的题型名称必须与正文各题型的名称完全一致，数量也与正文一致。

  - id: formula_summary
    title: 公式总结
    output_file: 公式总结.md
    template: |
      请基于本笔记本中的全部资料，用中文整理这门课程的完整公式总结。

      要求：

      1. 覆盖资料中所有重要公式（定义式、定理、定律、边界条件、常用结论等），按章节或主题分组。
      2. 每个公式包含：
         - 公式本体（LaTeX 独立公式 $$...$$）；
         - 名称与物理意义：这个公式说什么、为什么重要；
         - 适用条件：在什么前提/边界条件下成立，条件不满足时会怎样；
         - 相关公式：与其他公式的推导或对偶关系（可用 [[公式名]] 内链）。
      3. 对形式相近但含义不同的公式组，单独设"易混公式对比"小节，用表格对比区别。
      4. 最后给出记忆建议：哪些公式是核心、必须牢记；哪些可以现场推导、不必死记。

      格式要求：
      - Markdown 输出，全文有且仅有一个一级标题。
      - 公式一律 LaTeX。
      - 不要输出寒暄或结尾套话，无需附资料引用编号。

dynamic:
  question_type_detail:
    title: 题型详解
    output_subdir: 题型        # 输出文件 = output/<课程>/md/题型/<题型名>.md
    template: |
      本课程已总结出以下全部题型：{type_list}。

      请针对其中的「{type_name}」这一题型，基于本笔记本中的全部资料，用中文生成一份题型详解文档。

      要求：

      1. 例题（最重要）：
         - 从资料中选取 2-3 道该题型最具代表性的真实例题，优先选历年试卷与作业中的题；
         - 每道例题给出完整题目、详细解答过程（步骤清晰、每步注明依据）、最终答案。
      2. 高频解法：该题型的通用解题步骤模板（拿到题后的标准流程），以及不同变式下的解法选择策略。
      3. 易错点提醒：做这类题时最容易犯的错误、错误原因，以及如何在检查时发现自己错了。
      4. 与其他题型的联系：该题型与上面清单中其他题型在方法上的关联（例如共用某种数学工具、可以互相转化），可直接引用其他题型名称。
      5. 知识基础：做对这类题需要掌握的概念与公式，可用 [[内链]] 指向知识结构中的概念。

      格式要求：
      - Markdown 输出，一级标题为「{type_name}」。
      - 公式用 LaTeX（$...$ 与 $$...$$）。
      - 只写与该题型相关的内容，不要输出寒暄或结尾套话，无需附资料引用编号。
