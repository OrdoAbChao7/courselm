generation_schema_version: 2

planning:
  course_outline:
    id: course_outline
    title: 课程结构分析
    output_file: outline.json
    template: |
      请通读全部已上传课程资料，确定这门课真实、可用于期末复习的章节结构。
      优先尊重老师课件、教材目录和教学顺序；可以合并重复章节，但不要凭空发明资料中不存在的知识体系。
      只输出一个 JSON 对象，不要输出 Markdown 代码围栏或解释文字，结构严格为：
      {{"course_name":"课程名","chapters":[{{"index":1,"title":"章节名","topics":["主题1","主题2"]}}]}}
      index 从 1 连续编号，chapters 至少包含一个章节，topics 必须是当前章节的主要主题。

global:
  introduction:
    id: introduction
    title: 绪论
    output_file: 00-绪论.md
    template: |
      请根据课程资料生成《{course_name}》期末复习讲义的绪论。
      内容包括：本讲义的使用目标；课程整体知识脉络；资料能够支持的考情与内容优先级（无法确认的地方写[待确认]）；推荐学习顺序和考前三天安排。
      不要生成任何章节的完整内容，不要使用营销化标题。章节列表如下：
      {outline}

  appendices:
    - id: formula_appendix
      title: 附录一 重要公式汇总
      output_file: appendix/01-重要公式汇总.md
      template: |
        请根据课程资料和下方课程章节规划，整理全课程重要公式快速查询表。
        每条只保留公式名称、公式本体、适用条件、常见用途，必要时说明易混公式区别；不要重新讲完整课程，不要凭空补公式。
        课程章节规划：
        {outline}
    - id: question_index
      title: 附录二 典型题型索引
      output_file: appendix/02-典型题型索引.md
      template: |
        请根据课程资料和下方课程章节规划，生成典型题型快速定位表。
        使用“题目特征｜对应题型｜使用知识/公式｜所在章节”四列。只收录资料支持的题型，无法确认的内容标[待确认]，不要重新复制完整解法。
        课程章节规划：
        {outline}
    - id: final_review
      title: 附录三 考前复习提要
      output_file: appendix/03-考前复习提要.md
      template: |
        请根据课程资料和下方课程章节规划，生成全课程考前十几分钟可浏览的复习提要。
        只保留必记概念、必记结论、必记公式、高频题型、高频易错点和答题注意事项；使用高密度短句、表格和列表，不展开推导，不虚构考试信息。
        课程章节规划：
        {outline}

dynamic:
  chapter:
    title: 章节复习内容
    output_subdir: chapters
    template: |
      你正在生成《{chapter_index}》{chapter_title}这一章的完整期末复习内容。
      本章主要主题：{topics}
      全课程章节规划：
      {outline}

      严格输出以下结构，不得增加旧版“考试地图、题型识别地图、补给站、诊断室”等一级模块：
      # 第{chapter_index}章 {chapter_title}
      ## {chapter_index}.1 核心知识
      只保留做题必须知道的定义、定理和结论。每个知识点依次写：正式表述；一句话通俗理解；最低前置知识；考试通常怎么问；需要理解/背诵/会判断的要求。根据资料内容适配，不强行补不存在的公式。
      ## {chapter_index}.2 典型题型与解法
      对每个真实高频题型写题型识别信号、最短解题步骤、标准答题模板、关键得分点，以及必要时不会完整解答时可以写什么。不要把所有题型套成同一套步骤。
      ## {chapter_index}.3 典型例题
      每个重要题型原则上 1 道基础标准题和 1 道典型变式，最多 3 道。每题包含题目、来源标记、题型判断、解题思路、规范解答、关键得分点、一句话总结。严禁伪造真题来源。
      ## {chapter_index}.4 本章练习
      用 3—5 道最低过关题检查核心能力，优先使用资料原题；给出最终答案、必要步骤和对应知识点，不写成长篇精讲。
      ## {chapter_index}.5 易错点提醒
      只记录高价值错误，每条包含易错点、为什么容易错、正确做法，覆盖适用条件、边界、符号、漏写步骤和资料中反复出现的陷阱。
