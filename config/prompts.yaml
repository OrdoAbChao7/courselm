generation_schema_version: 3

planning:
  course_outline:
    id: course_outline
    title: 课程结构分析
    output_file: outline.json
    template: |
      请通读全部已上传课程与复习资料，提炼出面向期末突击自学复习的课程结构（高效课时/章节划分模式）。
      优先尊重老师课件、题库与教材核心目录；合并冗余学术章节，聚焦期末必考核心考点与高频题型，规划为 5~9 个独立高效章节。
      只输出一个 JSON 对象，不要输出 Markdown 代码围栏或解释文字，结构严格为：
      {{"course_name":"课程名","chapters":[{{"index":1,"title":"章节名","topics":["考点1/题型1","考点2/题型2"]}}]}}
      index 从 1 连续编号，chapters 至少包含一个章节，topics 必须是当前章节的核心考点或典型题型。

global:
  introduction:
    id: introduction
    title: 绪论
    output_file: 00-绪论.md
    template: |
      请根据课程资料生成《{course_name}》期末冲刺复习讲义的《考前突击提分使用指南》。
      读者有高中基础，刚开始系统复习这门大学课程，主要靠本讲义在考前自学冲刺通过期末考试。
      清晰说明五步提分闭环：“考情速览知权重 → 核心考点背口诀 → 标准例题跟步骤 → 避坑提醒防丢分 → 独立练习验真伪”；
      说明各章节之间的先后依赖关系、先学哪些必考基础盘、有余力再学哪些；给出考前 24~72 小时的高效冲刺时间分配方案。正文控制在一页以内。
      不要写死固定的三天日程，不要虚构未证实的分数或考试频率。让学生迅速建立信心并立即进入第一章学习。章节列表如下：
      {outline}

dynamic:
  chapter:
    title: 章节复习内容
    output_subdir: chapters
    template: |
      你正在生成第{chapter_index}章《{chapter_title}》的期末冲刺复习讲义。讲义风格：极简凝练、直击考点、口诀化速记、典型例题带练、保姆级分步解答、考场避坑防丢分。读者有高中基础，刚开始学这门大学课程。
      本章主要主题：{topics}
      配图约束：不要输出猜测的图片路径、Markdown 图片标签、外部图片链接或自行绘图。题图只由程序根据原资料绑定插入。
      每道题先完整写清文字条件、数值、单位和连接关系；没有可核验原图时不要仅写“如图所示”来代替必要条件。
      如果题目确实离不开原图且无法用原资料中的文字条件完整表述，明确标记“【原图待补，题目条件不完整】”，不要替换成相似题图或补造参数。
      全课程章节规划：
      {outline}

      严格按下面顺序输出。每个题型必须从一道具体的经典题目开始讲；不编造考试频率、题目出处、评分比例和得分承诺。不要写[推测]、高频、得分盘或冲刺盘，不输出机器引用编号或收尾祝语。学习顺序由前置知识决定，考试优先级只有资料明确证明时才标注。
      # 第{chapter_index}章 {chapter_title}

      ## 考情速览
      控制在一页以内。开篇给出经典的【考情速览表】：
      | 考点 / 题型 | 重要程度 | 预计分值 | 常见题型 |
      | :--- | :--- | :--- | :--- |
      表格列出本章核心考点与常见题型，重要程度标必考或星级（如必考、★★★★★、★★★），分值标合理范围（如6~10分、10~15分），常见题型标计算题/证明题/推导题/填空题/选择题等。下方用1~2句白话提分策略指明本章核心攻克重点、前置知识与高效通关路径。

      ## 题型一：具体题型名称
      每章只精讲课程资料支持、期末初学者必须掌握的典型题型，再按需要写题型二、题型三等。每一类都重复下面的小节，不要先集中罗列所有知识、通用步骤或例题；用短段落和清楚的小标题，避免多层列表与五列以上的宽表格。

      ### 核心考点与速记口诀
      只补本题马上要用的概念与定理：先用一句白话说明用途，再给必要的正式表述、符号含义和适用条件。提炼1~2句朗朗上口好记好用的【速记口诀】或解题心法（加粗呈现），把复杂定理转化为直观应试招式。文科/概念型考点提炼关键记忆要点与辨析准则。忘记上一章知识时就地补最小的一步并指明回看位置。不要把高中课程重讲一遍。

      ### 标准例题
      先给最典型、计算负担适中、能完整展示核心解题动作的一道题，再标明真实来源。优先选考察核心考点的典型题；若资料原题要连续使用多种方法或计算极长，就另编更精简的题标[必要补充]，把原题留给章末或课时练习。来源标记必须使用[真题·年份]、[老师题库]、[老师课件]、[作业原题]、[教材例题]、[改编题]或[必要补充]等方括号标签写在题干后；不能伪装成真题，每个题型的标准例题都切勿遗漏来源标签。题干完整、条件清楚。

      ### 跟着做
      用编号步骤完整解答（1. 2. 3. 或步骤一、步骤二）。每个关键步骤都紧跟“这一步做什么、为什么这样做、怎么算出来/推出来”；尤其不能省略从题目到公式、从公式到结论的跳转。简单四则运算可合并。证明题说明为何想到定理、每个条件在哪里用；推导计算题写清公式与代入过程。核对计算和最终结论。

      ### 避坑提醒
      在看完解答后，用少量编号步骤归纳识别线索、避坑提醒、可复用的做法及适用条件。剖析考场阅卷最容易扣分的常见陷阱与快速验算技巧。不要重抄整篇解答，不要给脱离例题的空白答题模板。

      ### 自己试
      给一道与标准例题很接近的独立练习，通常只换数字或外层形式，核心解法与步骤相同；不要突然换成完全不同的大题。先给不泄露答案的起步提示。解答另起以下四级标题，不要紧贴题目或把答案写在提示里：
      #### 解答
      写关键步骤和答案，指出一处最可能犯的错及改法。不要只给最终答案。
      只有常见变化会改变解法时，才在本题型末尾补一题短变式，解释变在哪里、做法为何变；不要固定凑题数。

      ## 课时过关练习
      精选2~3道覆盖本章核心考点的综合或典型练习题，检验学生能否认出题型、独立完成基础步骤并判断公式条件。提供提示、关键步骤、答案和做错后应回看的具体题型。
      #### 解答
      完整步骤、答案与做错回看具体题型指引。
