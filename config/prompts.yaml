generation_schema_version: 3

planning:
  course_outline:
    id: course_outline
    title: 课程结构分析
    output_file: outline.json
    template: |
      请通读全部已上传课程与面试资料，提炼出面向零基础快速入门与常见面试题突破的课程结构（高效专题课时划分模式）。
      优先覆盖大模型底座机制、智能体经典范式（ReAct/Plan-and-Solve/Reflection）、框架开发与自研、记忆与RAG检索、上下文工程与通信协议、Agentic-RL与微调、智能体评测与综合实战等高频面试考点，规划为 6~10 个独立高效章节/课时。
      只输出一个 JSON 对象，不要输出 Markdown 代码围栏或解释文字，结构严格为：
      {{"course_name":"课程名","chapters":[{{"index":1,"title":"章节名","topics":["考点1/题型1","考点2/题型2"]}}]}}
      index 从 1 连续编号，chapters 至少包含一个章节，topics 必须是当前章节的核心考点或典型题型。

global:
  introduction:
    id: introduction
    title: 绪论
    output_file: 00-绪论.md
    template: |
      请根据课程与面试资料生成《{course_name}》零基础入门与常见面试题精讲讲义的《新手入门与面试冲刺通关指南》。严禁在讲义标题、正文及任何位置出现“蜂考”等第三方机构或品牌字样。
      读者刚开始接触大模型与智能体（Agent）领域，目标是系统掌握该领域的入门知识，并通过搞懂常见的面试题型争取获得实习岗位。
      清晰说明五步通关闭环：“考情速览知权重 → 核心考点背口诀 → 标准例题跟步骤 → 避坑提醒防丢分 → 独立练习验真伪”；
      说明各章节之间的先后依赖关系、先学哪些必考基础盘、有余力再学哪些；给出面试备战 24~72 小时的高效冲刺时间分配方案。正文控制在一页以内。
      不要写死固定的三天日程，不要虚构未证实的分数或考试频率。让读者迅速建立信心并立即进入第一章学习。章节列表如下：
      {outline}

dynamic:
  chapter:
    title: 章节复习内容
    output_subdir: chapters
    template: |
      你正在生成第{chapter_index}章《{chapter_title}》的零基础入门与常见面试题精解讲义。讲义风格：零基础入门讲解、直击面试考点、口诀化速记、典型面试例题带练、保姆级分步解答、面试避坑防丢分。读者为刚学本领域知识、目标是攻克实习面试的初学者。严禁在标题、正文、表格或任何位置出现“蜂考”等字样。
      本章主要主题：{topics}
      全课程章节规划：
      {outline}

      严格按下面顺序输出。每个题型必须从一道具体的典型面试题或入门题开始讲；不编造考试频率、题目出处、评分比例和得分承诺。不要写[推测]、高频、得分盘或冲刺盘，不输出机器引用编号或收尾祝语。学习顺序由前置知识决定，考试优先级只有资料明确证明时才标注。
      # 第{chapter_index}章 {chapter_title}

      ## 考情速览
      控制在一页以内。开篇给出经典的【考情速览表】：
      | 考点 / 题型 | 重要程度 | 预计分值 | 常见题型 |
      | :--- | :--- | :--- | :--- |
      表格列出本章核心考点与常见面试题型，重要程度标必考或星级（如必考、★★★★★、★★★），分值标合理权重或分值，常见题型标概念辨析/原理推导/架构设计/代码实现/场景大题等。下方用1~2句白话策略指明本章核心攻克重点、前置知识与高效通关路径。

      ## 题型一：具体题型名称
      每章精讲核心入门知识与高频面试题型，再按需要写题型二、题型三等。每一类都重复下面的小节，不要先集中罗列所有知识、通用步骤或例题；用短段落和清楚的小标题，避免多层列表与五列以上的宽表格。

      ### 核心考点与速记口诀
      只补本题马上要用的入门概念与原理：先用一句白话通俗说明用途，再给必要的正式表述、符号含义和适用条件。提炼1~2句朗朗上口好记好用的【速记口诀】或解题心法（加粗呈现），把复杂原理转化为直观应试招式。文科/概念型考点提炼关键记忆要点与辨析准则。忘记上一章知识时就地补最小的一步并指明回看位置。

      ### 标准例题
      先给一道最典型、考察核心知识点、能完整展示解题思维的常见面试题或例题，再标明真实来源。优先选只需一种新方法、约三步即可解完的入门题；若资料原题要连续使用多种方法或计算很长，就另编更简单的题标[必要补充]，把原题留给章末或可选变式。来源标记使用[真题·2025秋招]、[真题·年份]、[老师题库]、[老师课件]、[作业原题]、[教材例题]、[改编题]或[必要补充]；不能伪装成真题。题干完整、条件清楚。

      ### 跟着做
      用编号步骤完整解答（1. 2. 3. 或步骤一、步骤二）。每个关键步骤都紧跟“这一步做什么、为什么这样做、怎么算出来/怎么写”；包含深入浅出的原理推导、标准答题要点或核心代码实现。概念题用具体例子或反例解释边界。

      ### 避坑提醒
      在看完解答后，用少量编号步骤归纳面试官最容易抓的盲区、易错陷阱、常见追问及回答思路。剖析面试中最容易失分的常见陷阱与答题亮点技巧。不要重抄整篇解答。

      ### 自己试
      给一道与标准例题很接近的独立面试练习题或变式题，检验自学效果。先给不泄露答案的起步提示。解答另起以下四级标题，不要紧贴题目或把答案写在提示里：
      #### 解答
      写关键步骤、核心答题要点或代码，指出一处最可能犯的错及改法。不要只给最终结论。
      只有常见变化会改变解法时，才在本题型末尾补一题短变式，解释变在哪里、做法为何变；不要固定凑题数。

      ## 课时过关练习
      精选2~3道覆盖本章核心考点的综合或典型练习题，检验学生能否认出题型、独立完成答题步骤。提供提示、关键步骤、答案和做错后应回看的具体题型。
      #### 解答
      完整步骤、答案与做错回看具体题型指引。
